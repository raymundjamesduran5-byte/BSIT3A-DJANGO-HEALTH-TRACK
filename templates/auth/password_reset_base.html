{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Password help{% endblock %} - HealthTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="{% static 'css/tabler.css' %}" rel="stylesheet">
  <link href="{% static 'css/healtrack-login.css' %}" rel="stylesheet">
</head>
<body class="heal-auth-body heal-reset-body">
  <main class="heal-reset-card">
    <a class="heal-brand heal-reset-brand" href="{% url 'login' %}"><span class="heal-brand-mark"><span aria-hidden="true">♥</span></span><span>Health<span>Track</span></span></a>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
